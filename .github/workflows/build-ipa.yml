name: Build Unsigned IPA

on:
  workflow_dispatch: # 允许在网页端手动点击按钮触发编译

jobs:
  build:
    runs-on: macos-15 # 提供满足项目要求的 Xcode 16+ 环境

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version & schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project DSHIOSApp.xcodeproj

      - name: Build unsigned .app bundle
        run: |
          xcodebuild build \
            -project DSHIOSApp.xcodeproj \
            -scheme DSHIOSApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry DSHIOSApp-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHIOSApp-unsigned-ipa
          path: DSHIOSApp-unsigned.ipa
          retention-days: 7
